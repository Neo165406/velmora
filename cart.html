        <ul class="sub-menu">
          <li><a href="shop.html?category=Rings">Rings</a></li>

          <li><a href="shop.html?category=Earrings">Earrings</a></li>
          <li><a href="shop.html?category=Bracelets">Bracelets</a></li>
        </ul>
      </li>
      <li><a href="shop.html?gender=Men">Men</a></li>

      <li><a href="shop.html?gender=Unisex">Unisex</a></li>

    </ul>
    <div class="nav-right">

      <a href="https://instagram.com/velmora" target="_blank" rel="noopener" class="icon-btn" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FAF6EF" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#FAF6EF" stroke="none"/></svg>
      </a>
      <a href="cart.html" class="cart-icon-wrap" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FAF6EF" stroke-width="1.6"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 7H6"/><circle cx="10" cy="20" r="1.2" fill="#E4C766"/><circle cx="17" cy="20" r="1.2" fill="#E4C766"/></svg>
        <span data-cart-count>0</span>

      <button class="hamburger" aria-label="Toggle menu">

      </button>
    </div>
  </nav>
  <div class="nav-overlay"></div>
  <div class="search-bar" id="search-bar">
    <div class="container">
      <input type="text" id="search-input" placeholder="Search products...">
    </div>
  </div>
</header>

<div class="page-hero">
  <div class="container">
    <h1>Your Cart</h1>
    <p>Review your pieces before checkout.</p>
  </div>
</div>

<section>
  <div class="container">
    <div id="cart-empty" class="empty-cart" style="display:none;">
      <p style="margin-bottom:20px;">Your cart is empty.</p>
      <a href="shop.html" class="btn btn-solid">Continue Shopping</a>
    </div>

    <div id="cart-full" class="cart-layout">
      <div>
        <div id="cart-items"></div>
      </div>

      <div class="cart-summary">
        <h3>Order Summary</h3>
        <div class="delivery-options">
          <label class="delivery-option">
            <input type="radio" name="delivery" value="dhaka" checked>
            Inside Dhaka
            <span class="fee">৳60</span>
          </label>
          <label class="delivery-option">
            <input type="radio" name="delivery" value="outside">
            Outside Dhaka
            <span class="fee">৳130</span>
          </label>
        </div>
        <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">৳0</span></div>
        <div class="summary-row"><span>Delivery</span><span id="sum-delivery">৳60</span></div>
        <div class="summary-row total"><span>Total</span><span id="sum-total">৳0</span></div>

        <form id="checkout-form" style="margin-top:24px;">
          <div class="form-field">
            <label for="c-name">Full Name</label>
            <input type="text" id="c-name" required>
          </div>
          <div class="form-field">
            <label for="c-phone">Phone Number</label>
            <input type="tel" id="c-phone" required>
          </div>
          <div class="form-field">
            <label for="c-address">Delivery Address</label>
            <textarea id="c-address" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-solid" style="width:100%; border:none;">Place Order — Cash on Delivery</button>
          <div class="form-status" id="checkout-status"></div>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="social-icons" style="justify-content:center; margin-bottom:20px;">
      <a href="https://instagram.com/velmora" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M15 8h2V4h-2a4 4 0 0 0-4 4v2H9v4h2v6h4v-6h2.5l.5-4H15V8a1 1 0 0 1 1-1z"/></svg>
      </a>
      <a href="https://wa.me/8801XXXXXXXXX" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M3 21l1.6-4.8A8 8 0 1 1 8.8 19.4L3 21z"/><path d="M8.5 9.5c0 3.5 3 6.5 6.5 6.5.6 0 1-.5.8-1l-1.3-1.9a.8.8 0 0 0-.9-.2l-1 .4a5 5 0 0 1-2.9-2.9l.4-1a.8.8 0 0 0-.2-.9L8.9 8.7c-.5-.2-1 .2-1 .8z"/></svg>
      </a>
    </div>
    <div class="footer-bottom">&copy; 2026 Velmora. All rights reserved.</div>
  </div>
</footer>

<script src="js/nav.js"></script>
<script src="js/cart.js"></script>
<script src="js/search.js"></script>
<script type="module">
  import { db, isFirebaseConfigured } from './js/firebase-config.js';
  import { collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  function gemIconSmall() {
    return `<svg viewBox="0 0 64 64" fill="none"><path d="M8 22L32 6L56 22L32 58L8 22Z" stroke="#FAF6EF" stroke-width="2" stroke-linejoin="round"/></svg>`;
  }

  function renderCart() {
    const cart = getCart();
    const empty = document.getElementById('cart-empty');
    const full = document.getElementById('cart-full');

    if (!cart.length) {
      empty.style.display = 'block';
      full.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    full.style.display = 'grid';

    document.getElementById('cart-items').innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="thumb">${item.image ? `<img src="${item.image}" alt="${item.name}" style="width:100%; height:100%; object-fit:cover;">` : gemIconSmall()}</div>
        <div class="details">
          <h4>${item.name}</h4>
          <div class="qty-stepper">
            <button type="button" data-minus="${item.id}">−</button>
            <input type="text" value="${item.qty}" readonly>
            <button type="button" data-plus="${item.id}">+</button>
          </div>
          <a href="#" class="remove-link" data-remove="${item.id}">Remove</a>
        </div>
        <div class="price">${formatTaka(item.price * item.qty)}</div>
      </div>
    `).join('');

    document.querySelectorAll('[data-minus]').forEach(btn => {
      const item = cart.find(i => i.id === btn.dataset.minus);
      btn.addEventListener('click', () => { updateQty(item.id, item.qty - 1); renderCart(); });
    });
    document.querySelectorAll('[data-plus]').forEach(btn => {
      const item = cart.find(i => i.id === btn.dataset.plus);
      btn.addEventListener('click', () => { updateQty(item.id, item.qty + 1); renderCart(); });
    });
    document.querySelectorAll('[data-remove]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        removeFromCart(link.dataset.remove);
        renderCart();
      });
    });

    updateSummary();
  }

  function currentZone() {
    return document.querySelector('input[name="delivery"]:checked').value;
  }

  function updateSummary() {
    const subtotal = cartSubtotal();
    const fee = getDeliveryFee(currentZone());
    document.getElementById('sum-subtotal').textContent = formatTaka(subtotal);
    document.getElementById('sum-delivery').textContent = formatTaka(fee);
    document.getElementById('sum-total').textContent = formatTaka(subtotal + fee);
  }

  document.querySelectorAll('input[name="delivery"]').forEach(radio => {
    radio.addEventListener('change', updateSummary);
  });

  document.getElementById('checkout-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const submitBtn = this.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    const order = {
      name: document.getElementById('c-name').value,
      phone: document.getElementById('c-phone').value,
      address: document.getElementById('c-address').value,
      zone: currentZone(),
      deliveryFee: getDeliveryFee(currentZone()),
      items: getCart(),
      subtotal: cartSubtotal(),
      total: cartSubtotal() + getDeliveryFee(currentZone()),
      status: 'pending'
    };

    try {
      if (isFirebaseConfigured) {
        await addDoc(collection(db, 'orders'), { ...order, createdAt: serverTimestamp() });
      } else {
        const orders = JSON.parse(localStorage.getItem('velmora_orders') || '[]');
        orders.push({ ...order, createdAt: new Date().toISOString() });
        localStorage.setItem('velmora_orders', JSON.stringify(orders));
      }
      localStorage.removeItem('velmora_cart');
      document.getElementById('checkout-status').textContent = 'Order placed! We\'ll call to confirm delivery.';
      this.reset();
      setTimeout(renderCart, 1200);
    } catch (err) {
      console.error('Order failed to save:', err);
      document.getElementById('checkout-status').textContent = 'Something went wrong placing the order — please try again.';
    }
    submitBtn.disabled = false;
  });

  renderCart();
</script>
</body>
</html>
