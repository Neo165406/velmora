<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Velmora</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-screen">
  <div class="login-box">
    <a href="index.html" class="brand" style="display:flex; justify-content:center; margin-bottom:26px; color:var(--maroon);">VEL<span style="color:var(--gold);">MORA</span></a>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-auth-tab="signin">Sign In</button>
      <button type="button" class="auth-tab" data-auth-tab="signup">Create Account</button>
    </div>

    <form id="signin-form" class="auth-form">
      <div class="field">
        <label for="si-email">Email</label>
        <input type="email" id="si-email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="si-password">Password</label>
        <input type="password" id="si-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-solid btn-block">Sign In</button>
      <a href="#" id="forgot-link" style="display:block; text-align:center; margin-top:14px; font-size:0.82rem; color:#6b4a4e; text-decoration:underline;">Forgot password?</a>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <div class="field">
        <label for="su-name">Full Name</label>
        <input type="text" id="su-name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input type="email" id="su-email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input type="password" id="su-password" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-solid btn-block">Create Account</button>
    </form>

    <div id="auth-status" class="form-status" style="text-align:center;"></div>
    <p style="text-align:center; margin-top:18px; font-size:0.82rem;"><a href="index.html" style="text-decoration:underline; color:#6b4a4e;">← Back to shopping</a></p>
  </div>
</div>

<script type="module">
  import { auth } from './js/firebase-init.js';
  import { isFirebaseConfigured } from './js/firebase-config.js';
  import {
    signInWithEmailAndPassword, createUserWithEmailAndPassword,
    updateProfile, sendPasswordResetEmail, onAuthStateChanged
  } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const statusEl = document.getElementById('auth-status');
  const tabs = document.querySelectorAll('[data-auth-tab]');
  const signinForm = document.getElementById('signin-form');
  const signupForm = document.getElementById('signup-form');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      statusEl.textContent = '';
      const isSignin = tab.dataset.authTab === 'signin';
      signinForm.classList.toggle('hidden', !isSignin);
      signupForm.classList.toggle('hidden', isSignin);
    });
  });

  function redirectAfterAuth() {
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('redirect') || 'index.html';
  }

  if (!isFirebaseConfigured) {
    statusEl.style.color = '#a15a5a';
    statusEl.textContent = "Sign in isn't set up yet — please check back soon.";
  } else {
    onAuthStateChanged(auth, function (user) {
      if (user) redirectAfterAuth();
    });

    signinForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      statusEl.textContent = '';
      const email = document.getElementById('si-email').value;
      const password = document.getElementById('si-password').value;
      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        statusEl.style.color = '#a15a5a';
        statusEl.textContent = 'Could not sign in — check your email and password.';
      }
      btn.disabled = false;
    });

    signupForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      statusEl.textContent = '';
      const name = document.getElementById('su-name').value;
      const email = document.getElementById('su-email').value;
      const password = document.getElementById('su-password').value;
      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if (name) await updateProfile(cred.user, { displayName: name });
      } catch (err) {
        statusEl.style.color = '#a15a5a';
        statusEl.textContent = err && err.code === 'auth/email-already-in-use'
          ? 'An account with this email already exists.'
          : 'Could not create your account — please try again.';
      }
      btn.disabled = false;
    });

    document.getElementById('forgot-link').addEventListener('click', async function (e) {
      e.preventDefault();
      const email = document.getElementById('si-email').value;
      if (!email) {
        statusEl.style.color = '#a15a5a';
        statusEl.textContent = 'Enter your email above first, then tap "Forgot password?" again.';
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        statusEl.style.color = '#155724';
        statusEl.textContent = 'Password reset email sent — check your inbox.';
      } catch (err) {
        statusEl.style.color = '#a15a5a';
        statusEl.textContent = 'Could not send reset email — check the address and try again.';
      }
    });
  }
</script>
</body>
</html>
